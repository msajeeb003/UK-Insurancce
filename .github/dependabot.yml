version: 2
updates:
  # Python runtime + dev + ocr requirements (all live under backend/).
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions used in the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The Dockerfile base image.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
